[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "orcapod"
description = "Intuitive and powerful library for highly reproducible scientific data pipeline"
dynamic = ["version"]
dependencies = [
    "xxhash",
    "networkx",
    "matplotlib>=3.10.3",
    "pandas>=2.2.3",
    "pyarrow>=20.0.0",
    "polars>=1.36.0",
    "numpy>=1.26.4",
    "beartype>=0.21.0",
    "deltalake>=1.0.2",
    "graphviz>=0.21",
    "gitpython>=3.1.45",
    "universal-pathlib>=0.3.8",
    "starfix>=0.5.0,<0.6",
    "tzdata>=2024.1",
    "uuid-utils>=0.11.1",
    "s3fs>=2025.12.0",
    "pydantic>=2.0",
    "typer>=0.12",
]
readme = "README.md"
requires-python = ">=3.11.0"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/metamorphic-labs/orcapod-python"
Repository = "https://github.com/metamorphic-labs/orcapod-python"
Changelog = "https://github.com/metamorphic-labs/orcapod-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/metamorphic-labs/orcapod-python/issues"

[project.optional-dependencies]
redis = ["redis>=6.2.0"]
ray = ["ray[default]==2.48.0", "ipywidgets>=8.1.7"]
postgresql = ["psycopg[binary]>=3.0"]
spiraldb = [
    "pyspiral>=0.16.33",
]
all = ["orcapod[redis]", "orcapod[ray]", "orcapod[postgresql]", "orcapod[spiraldb]"]

[project.scripts]
orcapod = "orcapod.cli:app"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/orcapod/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/orcapod"]

[tool.hatch.build.targets.sdist]
only-include = ["src/orcapod", "README.md", "LICENSE"]


[dependency-groups]
dev = [
    "basedpyright>=1.38.1",
    "httpie>=3.2.4",
    "hypothesis>=6.0",
    "hydra-core>=1.3.2",
    "imageio>=2.37.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "jsonschema>=4.25.0",
    "minio>=7.2.16",
    "pre-commit>=4.4.0",
    "pre-commit-hooks>=6.0.0",
    "pyarrow-stubs>=20.0.0.20250716",
    "pyiceberg>=0.9.1",
    "pyright>=1.1.404",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.1.1",
    "psycopg[binary]>=3.0",
    "ray[default]==2.48.0",
    "redis>=6.2.0",
    "ruff>=0.14.4",
    "testcontainers[minio]>=4.0.0",
    "testcontainers[postgres]>=4.0.0",
    "pip-licenses>=5.0.0",
    "tqdm>=4.67.1",
    "typing_extensions",
    "mkdocs-material>=9.7.5",
    "mkdocstrings[python]>=1.0.3",
]


[tool.ruff]
target-version = "py311"
line-length = 88
# Tutorial notebooks are not linted or formatted: reformatting rewrites their JSON, and
# the ones under old_tutorials/ target a package that no longer exists.
extend-exclude = ["notebooks"]

[tool.basedpyright]
# Strictness stays at the basedpyright default. Existing errors and warnings are
# recorded in .basedpyright/baseline.json; new errors fail the check.
# Warnings are reported but do not fail it (the recommended mode's default is to
# fail on warnings; relaxed by developer decision on 2026-11-09, ITL-826).
failOnWarnings = false
# Analyse as the oldest supported Python (the version CI type-checks on), so a
# local run under another interpreter reports the same errors as CI.
pythonVersion = "3.11"
# Setting `exclude` replaces the built-in defaults, so they are repeated here.
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "build",
    "dist",
    "site",
    "notebooks",
]

[tool.coverage.run]
omit = [
    "src/orcapod/extension_types/protocols.py",  # Protocol stubs — bodies are all `...`, not executable
]

[tool.coverage.report]
# Exclude lines that are never executed at runtime and cannot be covered by tests.
exclude_also = [
    "if TYPE_CHECKING:",  # typing-only imports; evaluated by type checkers only
]
