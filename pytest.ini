[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v
pythonpath = src
markers =
    postgres: mark test as requiring a live PostgreSQL instance
    integration: mark test as an integration test (may be slower)
    minio: tests requiring a running MinIO instance (via testcontainers or MINIO_ENDPOINT env var)
# The library value types warn that their hashes are provisional (ITL-1068), once per
# type per process, so whichever test uses one first would show it. The tests of the
# warning record it explicitly.
filterwarnings =
    ignore::orcapod.errors.ProvisionalHashWarning
