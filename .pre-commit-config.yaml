repos:
  # Keeps the ruff rev below equal to the ruff version in uv.lock, which is the
  # version CI runs (`uv run --with ruff` resolves to the locked dev dependency).
  - repo: https://github.com/tsvikas/sync-with-uv
    rev: v0.4.0
    hooks:
      - id: sync-with-uv
  # Same checks as the org required CI: `ruff check .` and `ruff format --check .`.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff-check
        types_or: [ python, pyi ]
      - id: ruff-format
        types_or: [ python, pyi ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types_or: [ python, pyi ]
      - id: end-of-file-fixer
        types_or: [ python, pyi ]
      - id: check-yaml
      - id: check-added-large-files
        # The basedpyright baseline is generated and large by design.
        exclude: ^\.basedpyright/baseline\.json$
      - id: check-merge-conflict
